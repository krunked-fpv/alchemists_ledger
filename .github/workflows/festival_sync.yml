name: Weekly Festival Sync

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-festivals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate weekly festival payload
        run: python3 scripts/sync_festivals.py

      - name: Commit and push updated festivals.json if changed
        run: |
          if git diff --quiet public/data/festivals.json && [ -z "$(git status --porcelain public/data/festivals.json)" ]; then
            echo "No changes to public/data/festivals.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/festivals.json
          git commit -m "chore(liveops): sync weekly festival payload"
          git push
